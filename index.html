<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tu Boleto | Sale window</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 bg-slate-950 text-slate-100">
  <main class="mx-auto w-full max-w-7xl p-6">
    <header>
      <h1 class="mb-1.5 text-2xl font-bold">Sale window</h1>
      <p id="summary" class="m-0 min-h-18 text-slate-400 sm:min-h-12 lg:min-h-6"></p>
      <p id="updated" class="m-0 mt-0.5 min-h-5 text-sm text-slate-500"></p>
    </header>
    <div id="tabs" role="tablist" aria-label="Sale channels" class="mt-6 flex gap-1 border-b border-slate-800">
      <button
        type="button"
        role="tab"
        id="tab-in-person"
        aria-controls="in-person"
        aria-selected="true"
        class="-mb-px cursor-pointer border-b-2 border-transparent px-3 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 aria-selected:border-slate-100 aria-selected:text-slate-100"
      >
        In person
      </button>
      <button
        type="button"
        role="tab"
        id="tab-online"
        aria-controls="online"
        aria-selected="false"
        class="-mb-px cursor-pointer border-b-2 border-transparent px-3 py-2 text-sm font-semibold text-slate-400 hover:text-slate-200 aria-selected:border-slate-100 aria-selected:text-slate-100"
      >
        Online
      </button>
    </div>
    <section id="in-person" role="tabpanel" aria-labelledby="tab-in-person" class="mt-4"></section>
    <section id="online" role="tabpanel" aria-labelledby="tab-online" class="mt-4 hidden"></section>
    <div id="empty" class="hidden py-20 text-center text-slate-400">
      There are no observations in the history yet.
    </div>
    <div class="mt-4 flex flex-wrap gap-5 text-sm">
      <span class="inline-flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-red-500"></span>
        Tickets sold
      </span>
      <span class="inline-flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-green-500"></span>
        Tickets available
      </span>
    </div>
  </main>
  <footer class="px-6 pb-6 text-center text-xs text-slate-400">
    <a
      class="hover:text-slate-200"
      href="https://marco-carvalho.github.io/machu-picchu-ticket-availability/"
    >
      https://marco-carvalho.github.io/machu-picchu-ticket-availability/
    </a>
  </footer>
  <script src="index.js"></script>
</body>
</html>
