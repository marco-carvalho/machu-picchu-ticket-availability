<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Boleto | Sale window</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 bg-white text-slate-900">
  <main class="mx-auto w-full max-w-7xl p-6">
    <header>
      <h1 class="mb-1.5 text-2xl font-bold">Sale window</h1>
      <p id="summary" class="m-0 min-h-18 text-slate-500 sm:min-h-12 lg:min-h-6"></p>
      <p id="updated" class="m-0 mt-0.5 min-h-5 text-sm text-slate-400"></p>
    </header>
    <section id="in-person" class="mt-6"></section>
    <section id="online" class="mt-8"></section>
    <div id="empty" class="hidden py-20 text-center text-slate-500">
      There are no observations in the history yet.
    </div>
    <div class="mt-4 flex flex-wrap gap-5 text-sm">
      <span class="inline-flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-red-600"></span>
        Tickets sold
      </span>
      <span class="inline-flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-green-600"></span>
        Tickets available
      </span>
    </div>
  </main>
  <footer class="px-6 pb-6 text-center text-xs text-slate-500">
    <a
      href="https://marco-carvalho.github.io/machu-picchu-ticket-availability/"
    >
      https://marco-carvalho.github.io/machu-picchu-ticket-availability/
    </a>
  </footer>
  <script src="index.js"></script>
</body>
</html>
